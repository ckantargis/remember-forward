<text x="240.00" y="484.00" text-anchor="middle" class="Ls">MEASURE THE GAP BETWEEN THE RING-AND-DOT MARK AND THE POLE YOU SEE. READ THE YEARS BELOW IT.</text>
<text x="240.00" y="500.00" text-anchor="middle" class="H">— HOW TO READ IT —</text>
<text x="30.00" y="514.00" text-anchor="start" class="Ls">1.  AT NIGHT, FIND THE POINT THE STARS TURN AROUND. THAT IS YOUR POLE. IT DOES NOT RISE OR SET.</text>
<text x="30.00" y="525.50" text-anchor="start" class="Ls">2.  FIND THE RING-AND-DOT MARK ON THE CIRCLE ABOVE. THAT IS WHERE YOUR POLE STOOD WHEN THIS PLATE WAS MADE.</text>
<text x="30.00" y="537.00" text-anchor="start" class="Ls">3.  MEASURE THE ANGLE BETWEEN THE TWO. A STICK HELD AT ARM'S LENGTH, A HAND'S BREADTH, ANY FIXED MEASURE WILL DO.</text>
<text x="30.00" y="548.50" text-anchor="start" class="Ls">4.  THE POLE TRAVELS THIS CIRCLE AT ONE PART IN 25,772 EACH YEAR. THE SCALE ABOVE CONVERTS YOUR ANGLE TO YEARS.</text>
<text x="30.00" y="560.00" text-anchor="start" class="Ls">5.  IF THE MARK AND YOUR POLE AGREE, LITTLE TIME HAS PASSED. IF THEY STAND FAR APART, MUCH HAS.</text>
<text x="30.00" y="573.50" text-anchor="start" class="Lx">A YEAR IS ONE RETURN OF THE SUN TO THE SAME PLACE AMONG THE STARS. THE CIRCLE CLOSES AND BEGINS AGAIN — IF THE STARS DISAGREE WITH THE MARK BY</text>
<text x="30.00" y="581.50" text-anchor="start" class="Lx">MORE THAN THE WHOLE SCALE, ONE FULL TURN OF 25,772 YEARS MAY HAVE PASSED. THE NAMED STARS ON THE RIM TELL YOU WHICH TURN.</text>
<line x1="30" y1="606" x2="450" y2="606" stroke="#000" stroke-width="4.0"/>
<text x="240.00" y="616.00" text-anchor="middle" class="M">NORTH ECLIPTIC POLE AT CENTRE · AZIMUTHAL EQUIDISTANT · STAR POSITIONS J2000 · OBLIQUITY 23.4393° · PRECESSION 50.2877"/YR · EPOCH 2026</text>
<text x="240.00" y="626.00" text-anchor="middle" class="M">TITANIUM GRADE 2 · STAR DOTS ENGRAVED AS PITS, DEPTH BY BRIGHTNESS · CC BY-SA 4.0 · REMEMBERFORWARD.ORG</text>
<text x="240.00" y="648.00" text-anchor="middle" class="Fb">THIS IS A PATIENT MESSAGE. IT WAS MADE FOR YOU, FREELY, BY PEOPLE WHO REMEMBERED FORWARD.</text>
<text x="240.00" y="663.00" text-anchor="middle" class="F">BUY IT · BUILD IT · BURY IT · FOR SOMEONE YOU WILL NEVER MEET</text>

<!-- CERAMIC RELIEF MASTER — plate12_precession_clock.svg
     Fired tile      120 x 170 mm
     Greenware/master 136.4 x 193.2 mm (scaled 1.136x for 12% shrinkage)
     Min text        2.50 mm cap height
     Min line        1.00 mm
     Relief depth    0.80 mm impressed
     Draft angle     5 deg (or the tile tears on release)
     Tile thickness  8 mm minimum

     MASTER IS A POSITIVE. Plaster negative is taken from it; the
     pressed tile reads IMPRESSED. Before extruding: Inkscape >
     Object to Path, then Stroke to Path, then save as plain SVG.

     DIAGNOSTIC, NOT FINAL ART. Type was floored, not re-laid-out.
     Overrunning text is the measurement, not a bug. -->
